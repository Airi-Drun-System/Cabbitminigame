:root{--bg1:#0b2a52;--bg2:#13708f;--gold:#ffe28a;--txt:#fff;--card:rgba(255,255,255,.1);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{font-family:BIPs,system-ui,sans-serif;color:var(--txt);background:linear-gradient(180deg,#0b2a52,#13708f 60%,#0e4a6a);background-attachment:fixed;overflow:hidden}
#stars{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));overflow-y:auto}
.hide{display:none!important}
h1{font-size:34px;text-align:center;line-height:1.05;text-shadow:0 3px 0 #0b2a52;margin-top:6px}
h1 span{color:var(--gold)}
.sub{opacity:.8;font-size:15px;margin:6px 0 14px;text-align:center}
.hero{width:150px;filter:drop-shadow(0 0 22px rgba(200,250,255,.6));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:440px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;position:relative;overflow:hidden;transition:transform .12s}
.card:active{transform:scale(.96)}
.card b{font-size:19px;line-height:1.1}.card small{opacity:.75;font-size:13px;font-family:system-ui,sans-serif}
.card .best{margin-top:auto;font-size:14px;color:var(--gold)}
.card .ic{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.top{width:100%;max-width:460px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-size:16px}
.top .sp{flex:1}.stat{font-size:18px}.stat i{font-style:normal;color:var(--gold)}
.hearts{display:flex;gap:4px}
#cv{width:100%;max-width:460px;border-radius:24px;background:rgba(0,0,0,.12);touch-action:manipulation}
.msg{font-size:20px;text-align:center;margin:10px 0;min-height:28px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:460px;margin-top:6px}
.opt{background:#fff;color:#0b2a52;border-radius:16px;padding:14px 0;font-size:26px;box-shadow:0 4px 0 #b8c6d9}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #b8c6d9}
.opt.ok{background:#7be3a3}.opt.bad{background:#ff9a9a}
.big{background:var(--gold);color:#0b2a52;border-radius:20px;padding:14px 28px;font-size:22px;box-shadow:0 5px 0 #c7a64a;margin-top:12px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c7a64a}
.tabs{display:flex;background:var(--card);border-radius:16px;padding:4px;gap:4px;width:100%;max-width:460px}
.tabs button{flex:1;padding:10px;border-radius:12px;font-size:16px;opacity:.7}.tabs button.on{background:rgba(255,255,255,.2);opacity:1}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:460px;margin-top:10px}
.pick button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;font-size:15px}
.over{position:fixed;inset:0;background:rgba(5,15,35,.75);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
.over .box{background:linear-gradient(180deg,#184a7a,#0e3358);border:1px solid var(--line);border-radius:26px;padding:22px;text-align:center;max-width:340px;width:100%}
.over h2{font-size:30px;color:var(--gold)}.over p{margin:10px 0;font-size:18px}
.snd{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px}
.foot{margin-top:auto;padding-top:16px;opacity:.6;font-size:13px;text-align:center}
</style></head><body>

function blastInit(){Object.assign(G,{g:Array(64).fill(0),score:0,fx:[],drag:null,txt:null});dealBB();setStat('Очки',0);$('#msg').textContent='Перетаскивай фигуры на поле';G.draw=drawBlast;G.tap=null;G.down=bbDown;G.move=bbMove;G.up=bbUp}
function dealBB(){G.pcs=[0,1,2].map(()=>({s:BPCS[rint(0,BPCS.length-1)],c:BCOL[rint(0,BCOL.length-1)],a:G.now||0}))}
const bbFits=(s,cx,cy)=>s.every(([dx,dy])=>cx+dx>=0&&cy+dy>=0&&cx+dx<8&&cy+dy<8&&!G.g[(cy+dy)*8+cx+dx]);
const bbAny=()=>G.pcs.some(p=>p&&[...Array(64).keys()].some(i=>bbFits(p.s,i%8,i/8|0)));

function bbDown(px,py,e){const j=SLOTX.findIndex((sx,i)=>G.pcs[i]&&Math.abs(px-sx)<W/6&&Math.abs(py-SLOTY)<80);if(j<0)return;G.drag={j,px,py,touch:!e||e.pointerType!=='mouse'};}

 const [cx,cy]=(()=>{G.drag=d;const r=bbTarget();G.drag=null;return r})();
 if(!bbFits(p.s,cx,cy)){beep(220,.08,'sine',.05);return}
 p.s.forEach(([dx,dy])=>G.g[(cy+dy)*8+cx+dx]=p.c);G.score+=p.s.length;G.pcs[d.j]=null;beep(520,.06,'triangle',.08);
 const rows=[],cols=[];for(let k=0;k<8;k++){if([...Array(8)].every((_,j)=>G.g[k*8+j]))rows.push(k);if([...Array(8)].every((_,j)=>G.g[j*8+k]))cols.push(k)}
 const clr=new Set();rows.forEach(r=>{for(let j=0;j<8;j++)clr.add(r*8+j)});cols.forEach(c=>{for(let j=0;j<8;j++)clr.add(j*8+c)});

const MN=7,MS=56,MO=(W-MN*MS)/2,MY=30;const MCOL=['#ff6b8b','#ffb347','#ffe066','#6ee7a8','#5ec8ff','#b28dff'];
function matchInit(){G.b=[];for(let r=0;r<MN;r++){G.b[r]=[];for(let c=0;c<MN;c++){let t;do{t=rint(0,5)}while((c>1&&G.b[r][c-1].t===t&&G.b[r][c-2].t===t)||(r>1&&G.b[r-1][c].t===t&&G.b[r-2][c].t===t));G.b[r][c]={t,px:c*MS,py:r*MS-MN*MS-r*20,sc:1}}}
 Object.assign(G,{phase:'fall',score:0,moves:20,target:800,combo:1,sel:null,lvl:1});setStat('Ходы',G.moves);$('#msg').textContent='Цель: '+G.target+' очков';G.draw=drawMatch;G.tap=null;G.down=m3Down;G.move=m3Move;G.up=m3Up}
function m3Find(){const m=new Set();for(let r=0;r<MN;r++)for(let c=0;c<MN-2;c++){const a=G.b[r][c],b=G.b[r][c+1],d=G.b[r][c+2];if(a&&b&&d&&a.t===b.t&&b.t===d.t){m.add(r*MN+c);m.add(r*MN+c+1);m.add(r*MN+c+2)}}
 for(let c=0;c<MN;c++)for(let r=0;r<MN-2;r++){const a=G.b[r][c],b=G.b[r+1][c],d=G.b[r+2][c];if(a&&b&&d&&a.t===b.t&&b.t===d.t){m.add(r*MN+c);m.add((r+1)*MN+c);m.add((r+2)*MN+c)}}return m}
function m3Swap(a,b){const t=G.b[a[0]][a[1]];G.b[a[0]][a[1]]=G.b[b[0]][b[1]];G.b[b[0]][b[1]]=t}
function m3HasMove(){for(let r=0;r<MN;r++)for(let c=0;c<MN;c++)for(const [dr,dc] of [[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(r2>=MN||c2>=MN)continue;m3Swap([r,c],[r2,c2]);const ok=m3Find().size>0;m3Swap([r,c],[r2,c2]);if(ok)return true}return false}
function m3Cell(px,py){const c=Math.floor((px-MO)/MS),r=Math.floor((py-MY)/MS);return r>=0&&c>=0&&r<MN&&c<MN?[r,c]:null}
function m3Try(a,b){if(G.phase!=='idle'||Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])!==1)return;m3Swap(a,b);G.swp=[a,b];G.phase='swap';G.sel=null;beep(400,.05,'triangle',.05)}
function m3Down(px,py){const c=m3Cell(px,py);if(!c)return;G.ds={c,px,py}}
function m3Move(px,py){const d=G.ds;if(!d)return;const dx=px-d.px,dy=py-d.py;if(Math.hypot(dx,dy)>22){const t=Math.abs(dx)>Math.abs(dy)?[d.c[0],d.c[1]+Math.sign(dx)]:[d.c[0]+Math.sign(dy),d.c[1]];G.ds=null;if(t[0]>=0&&t[1]>=0&&t[0]<MN&&t[1]<MN)m3Try(d.c,t)}}
function m3Up(){const d=G.ds;G.ds=null;if(!d||G.phase!=='idle')return;if(G.sel&&Math.abs(G.sel[0]-d.c[0])+Math.abs(G.sel[1]-d.c[1])===1)m3Try(G.sel,d.c);else G.sel=d.c}
function drawMatch(now){const dt=dtOf(now);x.clearRect(0,0,W,H);rr(MO-6,MY-6,MN*MS+12,MN*MS+12,16,'rgba(0,0,0,.22)');

 for(let r=0;r<MN;r++)for(let c=0;c<MN;c++){const t=G.b[r][c];if(!t)continue;const tx=c*MS,ty=r*MS;
  t.px+=(tx-t.px)*Math.min(1,dt*16);t.py+=Math.min(ty-t.py,Math.max(dt*900,(ty-t.py)*Math.min(1,dt*14)));if(ty<t.py)t.py=ty;
  if(Math.abs(tx-t.px)>.6||Math.abs(ty-t.py)>.6)settled=false;
  if(t.dead)t.sc=Math.max(0,t.sc-dt*5);
  if(MY+t.py<MY-MS)continue;x.save();x.beginPath();x.rect(MO-6,MY-6,MN*MS+12,MN*MS+12);x.clip();x.translate(MO+t.px+MS/2,MY+t.py+MS/2);x.scale(t.sc,t.sc);
  const sel=G.sel&&G.sel[0]===r&&G.sel[1]===c;const g=x.createLinearGradient(0,-MS/2,0,MS/2);g.addColorStop(0,'#fff');g.addColorStop(.15,MCOL[t.t]);g.addColorStop(1,MCOL[t.t]);
  x.fillStyle=g;x.beginPath();x.roundRect(-MS/2+3,-MS/2+3,MS-6,MS-6,14);x.fill();if(sel){x.strokeStyle='#fff';x.lineWidth=4;x.stroke()}
  drawKot(K,0,2,MS*.7);x.restore()}

   else{G.phase='idle';G.combo=1;
    if(G.score>=G.target){G.lvl++;G.target+=600+G.lvl*300;G.moves+=15;setStat('Ходы',G.moves);G.txt={s:'Уровень '+G.lvl+'!',t:now};sfx.win();$('#msg').textContent='Новая цель: '+G.target}
    else if(G.moves<=0)setTimeout(()=>G&&G.kind==='match'&&gameOver(G.score,'Очки: '+G.score+' · уровень '+G.lvl),300);
    if(!m3HasMove()){for(let r=0;r<MN;r++)for(let c=0;c<MN;c++)G.b[r][c].t=rint(0,5);G.phase='fall';G.txt={s:'Перемешиваем',t:now}}}}}
 if(G.phase==='clear'){let done=true;for(let r=0;r<MN;r++)for(let c=0;c<MN;c++){const t=G.b[r][c];if(t&&t.dead&&t.sc>0)done=false}
  if(done){for(let c=0;c<MN;c++){const col=[];for(let r=MN-1;r>=0;r--){const t=G.b[r][c];if(t&&!t.dead)col.push(t)}let k=0;for(let r=MN-1;r>=0;r--){if(k<col.length)G.b[r][c]=col[k++];else{const miss=MN-col.length;G.b[r][c]={t:rint(0,5),px:c*MS,py:(r-miss)*MS-MS*.3,sc:1}}}}G.phase='fall'}}
 if(G.txt&&now-G.txt.t<1.1)txt(G.txt.s,W/2,MY+MN*MS/2,40,'#ffe28a',cl(1.1-(now-G.txt.t)),back((now-G.txt.t)/.3));
 txt('Очки '+G.score,W/2,MY+MN*MS+40,26,'#fff');x.fillStyle='rgba(255,255,255,.15)';x.beginPath();x.roundRect(40,MY+MN*MS+64,W-80,12,6);x.fill();x.fillStyle='#ffe28a';x.beginPath();x.roundRect(40,MY+MN*MS+64,(W-80)*cl(G.score/G.target),12,6);x.fill()}
/* =========================================================
   7. 2048
   ========================================================= */
const Q=4,QS=92,QG=10,QO=(W-(Q*QS+(Q+1)*QG))/2,QY=20;
const QCOL={2:'#e8f4ff',4:'#cfe7ff',8:'#ffd27a',16:'#ffb057',32:'#ff8c5a',64:'#ff6b6b',128:'#ffe066',256:'#ffd43b',512:'#b2f2bb',1024:'#69db7c',2048:'#b28dff'};
function g2Init(){Object.assign(G,{tiles:[],score:0,won:false});g2Spawn();g2Spawn();setStat('Очки',0);$('#msg').textContent='Свайпай, чтобы соединять плитки';G.draw=draw2048;G.tap=null;G.down=(px,py)=>{G.sw={px,py}};G.move=null;
 G.up=(px,py)=>{if(!G.sw)return;const dx=px-G.sw.px,dy=py-G.sw.py;G.sw=null;if(Math.hypot(dx,dy)<25)return;g2Move(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))};
 G.key=k=>{const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'}[k];if(m)g2Move(m)}}
function g2At(r,c){return G.tiles.find(t=>!t.gone&&t.r===r&&t.c===c)}
function g2Spawn(){const free=[];for(let r=0;r<Q;r++)for(let c=0;c<Q;c++)if(!g2At(r,c))free.push([r,c]);if(!free.length)return;const [r,c]=free[rint(0,free.length-1)];G.tiles.push({v:R()<.9?2:4,r,c,px:c,py:r,sc:0})}
function g2Move(d){G.tiles=G.tiles.filter(t=>!t.gone);let moved=false;const vec={L:[0,-1],R:[0,1],U:[-1,0],D:[1,0]}[d];
 const order=[...Array(Q).keys()];const rs=d==='D'?[...order].reverse():order,cs=d==='R'?[...order].reverse():order;const merged=new Set();
 for(const r of rs)for(const c of cs){const t=g2At(r,c);if(!t)continue;let nr=r,nc=c;
  while(true){const r2=nr+vec[0],c2=nc+vec[1];if(r2<0||c2<0||r2>=Q||c2>=Q)break;const o=g2At(r2,c2);if(!o){nr=r2;nc=c2;continue}
   if(o.v===t.v&&!merged.has(o)){o.v*=2;o.pop=G.now;merged.add(o);t.gone=true;t.r=r2;t.c=c2;G.score+=o.v;moved=true;if(o.v===2048&&!G.won){G.won=true;G.txt={s:'2048!',t:G.now};sfx.win()}}break}
  if(!t.gone&&(nr!==r||nc!==c)){t.r=nr;t.c=nc;moved=true}else if(t.gone){}}
 if(moved){g2Spawn();setStat('Очки',G.score);beep(merged.size?600:350,.06,'triangle',.06)}
 const can=()=>{for(let r=0;r<Q;r++)for(let c=0;c<Q;c++){const t=g2At(r,c);if(!t)return true;for(const [a,b] of [[0,1],[1,0]]){const o=g2At(r+a,c+b);if(o&&o.v===t.v)return true}}return false};
 if(!can())setTimeout(()=>G&&G.kind==='g2048'&&gameOver(G.score,'Очки: '+G.score),600)}
function draw2048(now){const dt=dtOf(now);x.clearRect(0,0,W,H);const bw=Q*QS+(Q+1)*QG;rr(QO,QY,bw,bw,18,'rgba(0,0,0,.25)');
 for(let r=0;r<Q;r++)for(let c=0;c<Q;c++)rr(QO+QG+c*(QS+QG),QY+QG+r*(QS+QG),QS,QS,12,'rgba(255,255,255,.08)');
 const list=[...G.tiles].sort((a,b)=>(a.gone?0:1)-(b.gone?0:1));
 for(const t of list){t.px+=(t.c-t.px)*Math.min(1,dt*18);t.py+=(t.r-t.py)*Math.min(1,dt*18);t.sc=Math.min(1,t.sc+dt*6);
  if(t.gone&&Math.abs(t.c-t.px)<.05&&Math.abs(t.r-t.py)<.05)t.dead=true;if(t.dead)continue;
  const pop=t.pop?1+.15*Math.max(0,1-(now-t.pop)/.15):1;const cx=QO+QG+t.px*(QS+QG)+QS/2,cy=QY+QG+t.py*(QS+QG)+QS/2;
  x.save();x.translate(cx,cy);x.scale(t.sc*pop,t.sc*pop);rr(-QS/2,-QS/2,QS,QS,12,QCOL[t.v]||'#9b6bff');
  if(t.v>=2048)drawKot(K,0,-6,QS*.7);txt(String(t.v),0,t.v>=2048?QS*.32:2,t.v<100?40:t.v<1000?32:26,t.v<=4?'#0b2a52':'#fff');x.restore()}
 G.tiles=G.tiles.filter(t=>!t.dead);
 if(G.txt&&now-G.txt.t<1.5)txt(G.txt.s,W/2,QY+bw/2,60,'#ffe28a',cl(1.5-(now-G.txt.t)),back((now-G.txt.t)/.3));
 drawKot(K,W/2,QY+bw+70,90);txt('Собери 2048',W/2,QY+bw+130,22,'#bff3ff')}
/* =========================================================
   8. ПРЫГУЧИЙ КОТОКРОЛИК (флаппи)
   ========================================================= */
function flapInit(){Object.assign(G,{ky:H/2-40,vy:0,pipes:[],score:0,started:false,dead:false,spd:150,next:300});setStat('Очки',0);$('#msg').textContent='Нажимай, чтобы котокролик прыгал';G.draw=drawFlap;G.tap=flapTap;G.key=k=>{if(k===' '||k==='ArrowUp')flapTap()}}
function flapTap(){if(G.dead)return;G.started=true;G.vy=-400;beep(700,.07,'triangle',.06,1.4)}
function drawFlap(now){const dt=dtOf(now);x.clearRect(0,0,W,H);
 if(G.started&&!G.dead){G.vy+=1300*dt;G.ky+=G.vy*dt;G.spd=150+G.score*3;
  G.pipes.forEach(p=>p.x-=G.spd*dt);G.next-=G.spd*dt;if(G.next<=0){const gap=Math.max(140,180-G.score*2);G.pipes.push({x:W+40,top:rint(70,H-130-gap),gap,ok:false});G.next=230}
  G.pipes=G.pipes.filter(p=>p.x>-80);
  for(const p of G.pipes){if(!p.ok&&p.x+35<110){p.ok=true;G.score++;setStat('Очки',G.score);beep(900,.08)}
   if(110+20>p.x-35&&110-20<p.x+35&&(G.ky-18<p.top||G.ky+18>p.top+p.gap))G.dead=true}
  if(G.ky>H-40||G.ky<-30)G.dead=true;
  if(G.dead){sfx.bad();G.vy=-200;setTimeout(()=>G&&G.kind==='flap'&&gameOver(G.score,'Пролетел коробок: '+G.score),900)}}
 else if(G.dead){G.vy+=1300*dt;G.ky=Math.min(H-30,G.ky+G.vy*dt)}
 else G.ky=H/2-40+Math.sin(now*3)*10;
 // коробки-столбы
 for(const p of G.pipes){const bw=70,bh=44;for(let y=p.top;y>-bh;y-=bh)box(p.x,y,bw,bh-4,1,0);for(let y=p.top+p.gap+bh;y<H+bh;y+=bh)box(p.x,y,bw,bh-4,1,0)}
 rr(0,H-22,W,22,0,'rgba(0,0,0,.25)');
 drawKot(K,110,G.ky,58,cl(G.vy/900,-.5,.9),1,false);
 txt(String(G.score),W/2,60,54,'#fff');if(!G.started)txt('Нажми, чтобы начать',W/2,H/2+60,26,'#ffe28a',.6+.4*Math.sin(now*4))}

(async()=>{K=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=KOT_SRC});$('#heroImg').src=KOT_SRC;initStars();fit();updBest();
 (function sl(t){drawStars(t||0);requestAnimationFrame(sl)})()})();
